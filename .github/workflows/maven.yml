name: Java CI with Maven

on:
  push:
    branches:
      - develop

  pull_request:
    branches:
      - develop
      - IGDD-2764   # TEMP-TEST: revert before merge

  # Schedule runs on the default branch.
  schedule:
    - cron: '0 6 * * 1-5'

  workflow_dispatch:

# Ensure only one build changes dev environment at the same time    
concurrency: izgw-core-dev
# GITHUB_REF=refs/heads/testmain
#   
jobs:
  build:

    runs-on: ubuntu-latest 

    steps:
    
    - name: Checkout the software  
      uses: actions/checkout@v7
      # Necessary to enable push to protected branch
      with:
        ssh-key: ${{secrets.ACTIONS_KEY}}
        
    - name: Set up JDK 21
      uses: actions/setup-java@v6
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Set up Maven
      uses: stCarolas/setup-maven@v5.1
      with:
        maven-version: 3.9.0
        
    - name: Set up Toolchain
      shell: bash
      run: |
          mkdir -p ~/.m2 \
          && cat << EOF > ~/.m2/toolchains.xml
          <?xml version="1.0" encoding="UTF8"?>
          <toolchains>
            <toolchain>
              <type>jdk</type>
                <provides>
                  <version>11</version>
                  <vendor>sun</vendor>
                </provides>
                <configuration>
                  <jdkHome>$JAVA_HOME_11_X64</jdkHome>
                </configuration>
            </toolchain>            
            <toolchain>
              <type>jdk</type>
                <provides>
                  <version>21</version>
                  <vendor>sun</vendor>
                </provides>
                <configuration>
                  <jdkHome>$JAVA_HOME_21_X64</jdkHome>
                </configuration>
            </toolchain>            
          </toolchains>
          EOF
          
          cat << EOF > ~/.m2/settings.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <settings>
            <servers>
             <server>
               <id>github</id>
               <username>${{github.actor}}</username>
               <password>${{ secrets.GITHUB_TOKEN }}</password>
             </server>
              <server>
                <id>github-bom</id>
                <username>${{github.actor}}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
              <server>
                <id>github-core</id>
                <username>${{github.actor}}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF
          
          echo BASE_TAG=`mvn help:evaluate -Dexpression=project.version -q -DforceStdout` >> $GITHUB_ENV
          echo COMPUTERNAME=`hostname` >> $GITHUB_ENV
          
    - name: Sets env vars for push or pull request to release branch (default behavior)
      run: |
        echo IMAGE_BRANCH_TAG=`mvn help:evaluate -Dexpression=project.version -q -DforceStdout` >> $GITHUB_ENV
        echo IMAGE_TAG=`mvn help:evaluate -Dexpression=project.version -q -DforceStdout | sed "s/-SNAPSHOT$/-SNAPSHOT-${{github.run_number}}/"` >> $GITHUB_ENV
        # default to force a revision check unless releasing
        echo DO_REVISION_CHECK=true >> $GITHUB_ENV

    # If pulling to main branch (cutting a release), set branch tag appropriately  
    - name: Sets env vars for pull to main 
      if: ${{ github.base_ref == 'main' }}
      run: |
        IMAGE_TAG=`mvn help:evaluate -Dexpression=project.version -q -DforceStdout | sed "s/-.*$/-IZGW-SNAPSHOT-${{github.run_number}}/"` 
        echo IMAGE_TAG=$IMAGE_TAG >> $GITHUB_ENV
        IMAGE_BRANCH_TAG=`mvn help:evaluate -Dexpression=project.version -q -DforceStdout | sed "s/-.*$/-IZGW-SNAPSHOT/"`
        echo IMAGE_BRANCH_TAG=$IMAGE_BRANCH_TAG >> $GITHUB_ENV
        mvn versions:set -DnewVersion=$IMAGE_BRANCH_TAG -f pom.xml

        # Skip revision check on merge
        echo DO_REVISION_CHECK=false >> $GITHUB_ENV

    # If pushing to main branch (cutting a release), set branch tag appropriately  
    - name: Sets env vars for pull to main 
      if: ${{ github.ref_name == 'main' }}
      run: |
        IMAGE_TAG=`mvn help:evaluate -Dexpression=project.version -q -DforceStdout | sed "s/-.*$/-IZGW-RELEASE-${{github.run_number}}/"` 
        echo IMAGE_TAG=$IMAGE_TAG >> $GITHUB_ENV
        IMAGE_BRANCH_TAG=`mvn help:evaluate -Dexpression=project.version -q -DforceStdout | sed "s/-.*$/-IZGW-RELEASE/"`
        echo IMAGE_BRANCH_TAG=$IMAGE_BRANCH_TAG >> $GITHUB_ENV
        mvn versions:set -DnewVersion=$IMAGE_BRANCH_TAG -f pom.xml
        if [ ${{ github.event_name }} == 'push' ] 
        then
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          # Only push if something was committed
          if git commit -m "Update version to $IMAGE_BRANCH_TAG"
          then
            git pull
            git push
          fi
        fi
        # Disable revision check on push to main.
        echo DO_REVISION_CHECK=false >> $GITHUB_ENV

    - name: List m2
      shell: bash
      run: |
        # Display data for DX
        echo BASE_REF: ${{ github.base_ref }}
        echo HEAD_REF: ${{ github.head_ref }}
        echo REF_NAME: ${{ github.ref_name }}
        echo REF: ${{ github.ref }}
        echo EVENT_NAME ${{ github.event_name }}
        echo TAG: $BASE_TAG
        echo DO_REVISION_CHECK: $DO_REVISION_CHECK
        echo IMAGE_TAG: $IMAGE_TAG
        echo IMAGE_BRANCH_TAG: $IMAGE_BRANCH_TAG 
        cd ~/.m2
        ls -l
          
    - name: Check that push to main is from release branch
      # Don't filter on testmain to test push to main route
      if: ${{ ! startsWith(github.base_ref, 'Release_v') && github.head_ref == 'main' }}
      run: |
        echo ${{ github.head_ref }} is NOT a Release branch and cannot be pushed to main
        # Force failure
        false    

    - name: Maven Install + Site
      env:
        COMMON_PASS: ${{ secrets.COMMON_PASS }}
        ELASTIC_API_KEY: ${{ secrets.ELASTIC_API_KEY }}

      run: |
        env && mvn -B -U clean deploy -Dbuildno=${{github.run_number}} \
            -DdoRevisionCheck=${{env.DO_REVISION_CHECK}} \
            -DskipDependencyCheck=true \
            -Dimage.tag=$IMAGE_BRANCH_TAG
        # Two things avoid "[WARNING] Overwriting artifact's file ... to target/classes" (IGDD-2974):
        # 1. The command above lists only "deploy". "deploy" already runs "install". When both
        #    "install" and "deploy" are listed, Maven runs the build lifecycle twice.
        # 2. The site is built in a separate Maven run on purpose. When tests and "site" run in
        #    the same Maven run, "site" forks the build lifecycle and Maven prints the warning.
        # Do not use "clean" here. The site reads the test results that the first run wrote,
        # so the tests do not run again.
        mvn -B site -DskipTests -Dbuildno=${{github.run_number}} \
            -DdoRevisionCheck=${{env.DO_REVISION_CHECK}} \
            -DskipDependencyCheck=true \
            -Dimage.tag=$IMAGE_BRANCH_TAG

    - name: Upload build environment as artifact for failed build
      uses: actions/upload-artifact@v7
      if: ${{ failure() }}
      with:
        name: build-failure
        path: .

    # This scan does not use an NVD API key, and it has no NVD cache step. The action runs the
    # scanner with --noupdate. The scanner uses the NVD database that is inside the Docker image of
    # the action. The owners of the action build this image every night with a new database. Thus
    # the runner does not download NVD data, and it does not need a key.
    - name: Dependency Check
      env:
        # Per https://github.com/marketplace/actions/dependency-check, fix JAVA_HOME location for action
        JAVA_HOME: /opt/jdk
      uses: dependency-check/Dependency-Check_Action@main
      continue-on-error: false
      timeout-minutes: 15
      with:
        project: IZG Core
        path: target
        format: 'HTML'
        out: 'target/site'
        args: >
          --disableOssIndex
          --failOnCVSS 7
          --suppression ./dependency-suppression.xml
          --disableNuspec
          --disableNugetconf
          --disableAssembly
          --disableCentral

    - name: Upload dependency check log
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: DependencyCheck
        path: ./target/site/dependency-check-report.html
        if-no-files-found: ignore

    - name: Publish Site (Develop)
      # Publish to /develop/ for: push to develop, PRs targeting develop, scheduled runs, manual dispatch
      if: github.ref == 'refs/heads/develop' || (github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'develop') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
      uses: peaceiris/actions-gh-pages@v4.1.0
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./target/site
        destination_dir: develop

  release:
    needs: build
    runs-on: ubuntu-latest
    # This step should only be done on PUSH to main
    if: github.ref == 'refs/heads/testmain' || github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v7
      # Necessary to enable push to protected branch
      with:
        ssh-key: ${{secrets.ACTIONS_KEY}}

    - name: Create GitHub Release
      id: create_release
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{env.TAG}}
        name: IZ Gateway ${{env.TAG}} Release
        body_path: ./docs/release/RELEASE_NOTES.md
        draft: true
        generate_release_notes: true
        files: |
          ./docs/release/*.md

    - name: Upload release documentation as artifact for failed release
      uses: actions/upload-artifact@v7
      if: ${{ failure() }}
      with:
        name: release-failure
        path: ./docs/release/*.md

    - name: Checkin Release Documentation to Build
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        git config pull.rebase false 
        git add ./docs/release
        if git commit -m "generated"
        then
          git pull
          git push
        fi

  # Auto-approve and merge PRs opened by the NIGHTLY Security Updates workflow
  # (.github/workflows/security-updates.yml) once the build job above has built the PR,
  # passed the unit tests, deployed the SNAPSHOT to GitHub Packages, built the site and
  # passed OWASP dependency-check. izgw-core is a library with no dev environment of its own.
  # Manual-run PRs (security-updates/manual-*) and any other PR are never auto-merged.
  auto-merge-security-updates:
    needs: build
    if: >-
      github.event_name == 'pull_request' &&
      contains(fromJSON('["develop","IGDD-2764"]'), github.event.pull_request.base.ref) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == 'izg-dependency-bot[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'security-updates/nightly-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Provenance check. Commit metadata (author, committer) is chosen by whoever creates
      # the commit, but the repository activity log records the authenticated actor that
      # actually created or updated the branch, and that cannot be faked. Every write to
      # this branch must have been made by izg-dependency-bot[bot], and the last write
      # must have produced exactly the head commit that was built and tested.
      # Fails closed: no activity, any other actor, or a head mismatch refuses the merge.
      - name: Verify only izg-dependency-bot wrote to the PR branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ACTIVITY=$(gh api -X GET "repos/$GH_REPO/activity" --paginate \
            -f ref="refs/heads/$HEAD_REF" -f direction=asc -f per_page=100 \
            --jq '.[] | "\(.actor.login // "unknown") \(.activity_type) \(.after)"')
          echo "Branch activity (actor type after):"
          echo "${ACTIVITY:-<none>}"
          if [ -z "$ACTIVITY" ]; then
            echo "::error::Auto-merge refused: no activity recorded for $HEAD_REF, so its provenance cannot be verified."
            exit 1
          fi
          ACTORS=$(printf '%s\n' "$ACTIVITY" | awk '{print $1}' | sort -u)
          if [ "$ACTORS" != "izg-dependency-bot[bot]" ]; then
            echo "::error::Auto-merge refused: $HEAD_REF was written by actor(s) other than izg-dependency-bot[bot]: $(echo $ACTORS)"
            exit 1
          fi
          if printf '%s\n' "$ACTIVITY" | awk '{print $2}' | grep -qx force_push; then
            echo "::error::Auto-merge refused: $HEAD_REF has been force-pushed."
            exit 1
          fi
          LAST_AFTER=$(printf '%s\n' "$ACTIVITY" | tail -1 | awk '{print $3}')
          if [ "$LAST_AFTER" != "$HEAD_SHA" ]; then
            echo "::error::Auto-merge refused: last recorded write to $HEAD_REF is $LAST_AFTER, not the tested head $HEAD_SHA."
            exit 1
          fi
          echo "Provenance OK: every write to $HEAD_REF was made by izg-dependency-bot[bot]."

      # Guard against anything other than the bot's own pom.xml bump, e.g. a human pushing
      # extra commits to the bot's branch. Author metadata alone can be faked with
      # `git commit --author=...`, so every commit must also carry a GitHub-verified
      # signature. security-updates.yml creates its commit through the Git Data API with the
      # App token, and GitHub signs commits made that way. GitHub records its own signing
      # account, web-flow, as the COMMITTER of such commits, never the bot, so the expected
      # identity is "izg-dependency-bot[bot] web-flow true". web-flow alone does not prove
      # who made the commit; the activity-log check above does.
      - name: Verify PR only contains bot-authored pom.xml changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename' | sort -u)
          echo "Changed files: $FILES"
          if [ "$FILES" != "pom.xml" ]; then
            echo "::error::Auto-merge refused: PR changes files other than pom.xml."
            exit 1
          fi
          # One line per distinct "author committer verified" combination across all commits.
          IDENTITIES=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER/commits" --paginate \
            --jq '.[] | "\(.author.login // "unknown") \(.committer.login // "unknown") \(.commit.verification.verified)"' \
            | sort -u)
          echo "Commit author / committer / verified: $IDENTITIES"
          if [ "$IDENTITIES" != "izg-dependency-bot[bot] web-flow true" ]; then
            echo "::error::Auto-merge refused: every commit must be authored by izg-dependency-bot[bot], committed and signed by GitHub (web-flow), and verified."
            exit 1
          fi

      # develop requires one approving review. The PR is authored by izg-dependency-bot,
      # so github-actions[bot] (GITHUB_TOKEN) can supply it. Requires the repo setting
      # "Allow GitHub Actions to create and approve pull requests".
      - name: Approve PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review "$PR_NUMBER" --approve \
            --body "Auto-approved: nightly security patch update passed build, unit tests, deploy and dependency-check in run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."

      # Merge with the App token, not GITHUB_TOKEN, so the push to develop triggers the
      # develop build. --match-head-commit ensures only the commit tested above is merged.
      - name: Generate Dependency Bot App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DEPENDENCY_BOT_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_BOT_APP_KEY }}

      - name: Merge PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr merge "$PR_NUMBER" --merge --delete-branch --match-head-commit "$HEAD_SHA"
          echo "Merged PR #$PR_NUMBER into develop." >> "$GITHUB_STEP_SUMMARY"
